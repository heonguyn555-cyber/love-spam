<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spammm me</title>

    <style>

        body{
            background: linear-gradient(
                to right,
                rgb(228, 85, 109),
                pink,
                rgb(192, 255, 255)
            );
            overflow: hidden;
        }

        .block{
            position: absolute;
            top: 25px;
            left: 25px;

            width: calc(100% - 50px);
            height: calc(100% - 50px);

            background-color: rgb(255, 219, 219);
            border-radius: 50px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        button[name='likeyou']{
            margin-top: 300%;
            width: 160px;
            height: 70px;
            border-radius: 20px;
            border: none;
            cursor: pointer;

            background: linear-gradient(
                to top,
                rgb(228,85,109),
                pink
            );
        }

        .button{
            position: absolute;
            bottom: 80px;
        }

        .heart1, .heart2{
            position: absolute;
            top:30%;
            transform: translate(-50%,-50%);
            text-align: center;
            z-index: 1;
        }

        .heart1{ left: 30%; }
        .heart2{ left: 70%; }

        .heart1 svg,
        .heart2 svg{
            width: 200px;
            height: 200px;
            z-index: 1;
        }
        .heart1 svg{
            width: 200px;
            height: 200px;
            animation: heartbeatLeft 1.7s ease-in-out infinite;
        }
        .heart2 svg{
            width: 200px;
            height: 200px;
            animation: heartbeatRight 1.3s ease-in-out infinite;
            animation-delay: 0.3s;
        }

        .sparkle{
            position:absolute;

            width:20px;
            height:20px;

            border-radius:50%;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    white,
                    rgba(255,255,255,0.2)
                );

            box-shadow:
                0 0 10px white,
                0 0 20px pink,
                0 0 30px rgb(255,120,180);

            animation:
                sparkleMove 2s infinite ease-in-out;

            pointer-events:none;

            z-index:999;
        }

        .heart1 .sparkle{
            top:20px;
            right: 30px;
        }

        .heart2 .sparkle{
            top:20px;
            right: 30px;
        }
        @keyframes sparkleMove{
            0%{ transform:translate(0,0) scale(1); opacity:0.8; }
            50%{ transform:translate(5px,-5px) scale(1.2); opacity:1; }
            100%{ transform:translate(0,0) scale(1); opacity:0.8; }
        }

        /* CHAT */

        .chat{
            position: absolute;

            bottom: 80px;
            left: 50px;

            width: 350px;
            height: 220px;

            overflow: hidden;
            pointer-events: none;
        }

        .msg{
            position: absolute;

            left: 0;
            bottom: 0;

            background: white;

            padding: 10px 15px;

            border-radius: 15px;

            transition:
                transform 0.5s ease,
                opacity 0.5s ease;

            /* thêm đoạn này */

            max-width: 250px;

            word-wrap: break-word;

            overflow-wrap: break-word;

            white-space: normal;
        }
        input{
            position: absolute;

            bottom: 20px;
            left: 50px;

            width: 300px;

            padding: 12px;

            border-radius: 15px;

            border: none;

            outline: none;
        }
        .intro{
            position: fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:
                linear-gradient(
                    to right,
                    rgb(228,85,109),
                    pink,
                    rgb(192,255,255)
                );

            display:flex;
            justify-content:center;
            align-items:center;

            z-index:9999;
        }

        .introBox{

            background:white;

            padding:40px;

            border-radius:30px;

            display:flex;
            flex-direction:column;

            gap:20px;

            width:300px;

            text-align:center;
        }

        .introBox input{

            padding:12px;

            border:none;

            border-radius:15px;

            background:#eee;

            outline:none;
        }

        .introBox button{

            padding:12px;

            border:none;

            border-radius:15px;

            cursor:pointer;

            background:pink;
        }
        .score{
            margin-top: 10px;
            font-size: 28px;
            font-weight: bold;
            color: rgb(0, 0, 0);
            text-align: center;
        }
        @keyframes heartbeatLeft{

            0%{
                transform: scale(1);
            }

            20%{
                transform: scale(1.04);
            }

            35%{
                transform: scale(0.98);
            }

            50%{
                transform: scale(1.07);
            }

            100%{
                transform: scale(1);
            }

        }

        @keyframes heartbeatRight{

            0%{
                transform: scale(1);
            }

            15%{
                transform: scale(1.06);
            }

            30%{
                transform: scale(0.97);
            }

            45%{
                transform: scale(1.03);
            }

            100%{
                transform: scale(1);
            }

        }
        .bump{
            animation: bump 0.35s ease;
        }

        @keyframes bump{

            0%{
                transform: scale(1);
            }

            25%{
                transform: scale(1.18);
            }

            50%{
                transform: scale(0.95);
            }

            75%{
                transform: scale(1.08);
            }

            100%{
                transform: scale(1);
            }

        }
        stop{
            transition: all 0.5s ease;
        }

    </style>
</head>

<body>

    <div class="block">
        <div class="intro" id="intro">
            <div class="introBox">
                <h1>...</h1>
                <input
                    type="text"
                    id="nameInput"
                    placeholder="Tên..."
                >
                <button id="startBtn">
                    Bắt Đầu
                </button>
            </div>
        </div>

        <div class="heart">

            <div class="heart1">

                <div class="sparkle"></div>

                <svg viewBox="0 0 32 29">
                    <defs>
                        <linearGradient id="gradLeft" x1="0" y1="1" x2="0" y2="0">
                            <stop id="leftStop" offset="0%" stop-color="red"/>
                            <stop offset="0%" stop-color="white"/>
                        </linearGradient>
                    </defs>

                    <path fill="url(#gradLeft)"
                    d="M23.6,0c-3.4,0-6.4,2-7.6,5.1C14.8,2,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4
                    c0,9.1,16,20.6,16,20.6S32,17.5,32,8.4C32,3.8,28.2,0,23.6,0z"/>
                </svg>

                <div id="scoreLeft" class="score">0</div>

            </div>

            <div class="heart2">

                <div class="sparkle"></div>

                <svg viewBox="0 0 32 29">
                    <defs>
                        <linearGradient id="gradRight" x1="0" y1="1" x2="0" y2="0">
                            <stop id="rightStop" offset="0%" stop-color="red"/>
                            <stop offset="0%" stop-color="white"/>
                        </linearGradient>
                    </defs>

                    <path fill="url(#gradRight)"
                    d="M23.6,0c-3.4,0-6.4,2-7.6,5.1C14.8,2,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4
                    c0,9.1,16,20.6,16,20.6S32,17.5,32,8.4C32,3.8,28.2,0,23.6,0z"/>
                </svg>

                <div id="scoreRight" class="score">0</div>

            </div>

        </div>

        <div class="button">
            <form>
                <button name="likeyou" type="button">
                    MISS
                </button>
            </form>
        </div>

        <div class="chat" id="chat"></div>
        <form>
            <input type="text" id="inputMessage" placeholder="chat...">
        </form>

    </div>

</body>

<script>
    let leftScore = 0;
    let rightScore = 0;

    const scoreLeft =
        document.getElementById("scoreLeft");

    const scoreRight =
        document.getElementById("scoreRight");

    const leftStop =
        document.getElementById("leftStop");

    const rightStop =
        document.getElementById("rightStop");



    const heartLeft =
        document.querySelector(".heart1 svg");

    const heartRight =
        document.querySelector(".heart2 svg");



    const chat = document.getElementById("chat");

    const messages = [];

    const input = document.getElementById("inputMessage");
    let username = "Unknown";
    let isHyperOwner = false;

    const intro = document.getElementById("intro");

    const startBtn = document.getElementById("startBtn");

    const nameInput = document.getElementById("nameInput");


    const likeButton =
        document.querySelector("button[name='likeyou']");

    likeButton.addEventListener("click",()=>{
        rightScore += 1;

        // update tim
        updateHeart();

    });



    nameInput.addEventListener("keydown",(e)=>{

        if(e.key === "Enter"){

            startBtn.click();

        }

    });

    startBtn.addEventListener("click",()=>{

        const value = nameInput.value.trim();

        if(value !== ""){

            // kiểm tra cú pháp đặc biệt
            if(value.startsWith("hyperowner ")){

                isHyperOwner = true;

                username =
                    value.replace("hyperowner ","").trim();

            }else{

                isHyperOwner = false;

                username = value;

            }

        }

        intro.style.display = "none";

    });

    input.addEventListener("keydown",(e)=>{

        if(e.key === "Enter"){

            e.preventDefault();

            const text = input.value.trim();

            if(text !== ""){

                addMessage("["+ username +"]: " + text);

                input.value = "";

            }

        }

    });

    function updateHeart(){
        heartLeft.classList.remove("bump");
        heartRight.classList.remove("bump");

        void heartLeft.offsetWidth;
        void heartRight.offsetWidth;

        heartLeft.classList.add("bump");
        heartRight.classList.add("bump");

        // update text
        scoreLeft.innerText = leftScore;
        scoreRight.innerText = rightScore;

        // đổi sang %
        const leftPercent =
            (leftScore / 200) * 100;

        const rightPercent =
            (rightScore / 200) * 100;

        // fill màu tim
        leftStop.setAttribute(
            "offset",
            `${leftPercent}%`
        );

        rightStop.setAttribute(
            "offset",
            `${rightPercent}%`
        );

    }

    function addMessage(text){

        const msg = document.createElement("div");

        msg.className = "msg";

        const pureText =
            text.replace(`[${username}]: `,"");

        if(isHyperOwner){

            msg.innerHTML =
                `<span style="
                    color:red;
                    font-weight:bold;
                ">
                    [${username}]
                </span>: ${pureText}`;

        }else{

            msg.innerText = text;

        }

        chat.appendChild(msg);

        messages.push(msg);

        updateMessages();

    }

    function updateMessages(){

        let currentY = 0;

        for(let i = messages.length - 1; i >= 0; i--){

            const msg = messages[i];

            msg.style.transform =
                `translateY(-${currentY}px)`;

            msg.style.opacity =
                1 - ((messages.length - 1 - i) * 0.2);

            currentY += msg.offsetHeight + 10;

        }

        if(messages.length > 5){

            const old = messages.shift();

            old.remove();

        }

    }
    updateHeart();

</script>

</html>
